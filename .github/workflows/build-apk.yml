name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder and auto-fix upload mistakes
        id: find
        run: |
          echo "--- uploaded files ---"
          find . -path ./.git -prune -o -type f -print | head -60
          S=$(find . -name settings.gradle | head -1)
          if [ -z "$S" ]; then
            echo "ERROR: settings.gradle sapadli nahi."
            echo "## BUILD FAILED: settings.gradle sapadli nahi (files chukichya jaagi upload zalyat)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          D=$(dirname "$S")
          cd "$D"
          # app folder chya AATLYA files mool jaagi upload zalyas: src/ ani build.gradle chukichya jaagi astat -> app/ madhe halvto
          if [ -f src/main/AndroidManifest.xml ]; then
            echo "Fix: src/ mool jaagi sapadla -> app/src madhe halvto"
            mkdir -p app/src
            cp -r src/. app/src/
            if grep -q namespace build.gradle 2>/dev/null; then cp build.gradle app/build.gradle; fi
          fi
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "## BUILD FAILED: app/src/main/AndroidManifest.xml sapadli nahi (app folder upload zala nahi)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # mool build.gradle nehmi barobar thevto
          printf "plugins {\n    id 'com.android.application' version '8.5.2' apply false\n}\n" > build.gradle
          echo "Project folder: $D"
          cd "$GITHUB_WORKSPACE"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show error summary (only if build failed)
        if: failure()
        run: |
          {
            echo "## BUILD FAILED - khali cha text copy karun mala pathva"
            echo '```'
            if [ -f build.log ]; then
              grep -n -E "error:|What went wrong|Execution failed|FAILURE|Caused by|Could not|not found|SDK location|license" build.log | head -40
              echo "----- last lines -----"
              tail -n 25 build.log
            else
              echo "build.log nahi (build suru hoyachya aadhich fail zala)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceManager-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
